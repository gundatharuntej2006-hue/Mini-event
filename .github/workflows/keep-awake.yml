# Keep the free Render instance awake.
#
# A free Render web service spins down after about 15 minutes with no
# requests, and the next request then waits ~50 seconds while it boots. On
# event day that is a marshal watching a spinner while a squad stands at a
# gate, so this pings the health endpoint often enough that it never idles.
#
# WHAT THIS DOES NOT DO — worth being clear, because the name oversells it:
#   - it cannot prevent downtime from a deploy, a crash, or Render's own
#     maintenance; it only prevents the IDLE spin-down;
#   - it cannot stop the free Postgres expiring 30 days after creation;
#   - it is not a guarantee. GitHub's scheduled runners are best-effort and
#     a cron can be delayed by 10+ minutes under load, so an occasional gap
#     is normal. For the event itself, treat the paid instance as the real
#     answer and this as the free approximation.
#
# COST, WHICH IS THE PART THAT BITES: a free Render instance kept awake
# around the clock consumes roughly a full month of the account's free
# instance-hours. Exhaust them and the service stops for the remainder of
# the month — the opposite of the goal. So this is deliberately NOT set to
# run all year: enable it in the window around the event, and disable it
# afterwards. See the `on:` block below.

name: Keep Render awake

on:
  # Every 10 minutes. Render idles at ~15, which leaves room for GitHub's
  # scheduler to run late without a gap opening up.
  schedule:
    - cron: "*/10 * * * *"
  # So you can prove it works without waiting for the cron.
  workflow_dispatch:

# Two runs pinging at once achieves nothing; skip the queued one.
concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and verify it is actually healthy
        run: |
          URL="https://event-hq-api.onrender.com/api/v1/health"

          # --max-time 120: a cold start legitimately takes ~50s, and a
          # timeout shorter than that would report a healthy service as down.
          # --retry covers the case where the first packet arrives while the
          # instance is still coming up.
          body=$(curl -sS --max-time 120 --retry 2 --retry-delay 20 \
                      -w "\n%{http_code}|%{time_total}" "$URL") || {
            echo "::error::Could not reach $URL"
            exit 1
          }

          code=$(echo "$body" | tail -1 | cut -d"|" -f1)
          secs=$(echo "$body" | tail -1 | cut -d"|" -f2)
          json=$(echo "$body" | sed '$d')

          echo "HTTP $code in ${secs}s"
          echo "$json"

          if [ "$code" != "200" ]; then
            echo "::error::Health check returned HTTP $code"
            exit 1
          fi

          # A 200 alone is not enough. The app answers 200 while reporting an
          # unhealthy database, and a service that is awake but cannot reach
          # Postgres is no use to anyone at a gate.
          case "$json" in
            *'"database":"healthy"'*) : ;;
            *)
              echo "::error::API is up but the database is not healthy"
              exit 1
              ;;
          esac

          # Over ~20s means it had gone to sleep despite the schedule —
          # surfaced in the log so a pattern of it is visible rather than
          # silently tolerated.
          awoke=$(echo "$secs > 20" | bc -l 2>/dev/null || echo 0)
          if [ "$awoke" = "1" ]; then
            echo "::warning::Took ${secs}s — the instance had spun down."
          fi
